<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131926" />
      <stop offset="100%" stop-color="#0B0F17" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#232D42" stroke-width="4" />

  <!-- Subtle Swiss Grid Pattern -->
  <g opacity="0.15" stroke="#64748B" stroke-width="1.5">
    <line x1="128" y1="64" x2="128" y2="448" stroke-dasharray="6 6" />
    <line x1="256" y1="64" x2="256" y2="448" stroke-dasharray="6 6" />
    <line x1="384" y1="64" x2="384" y2="448" stroke-dasharray="6 6" />
    <line x1="64" y1="128" x2="448" y2="128" stroke-dasharray="6 6" />
    <line x1="64" y1="256" x2="448" y2="256" stroke-dasharray="6 6" />
    <line x1="64" y1="384" x2="448" y2="384" stroke-dasharray="6 6" />
  </g>

  <!-- Camera Body Outline -->
  <rect x="110" y="160" width="292" height="210" rx="36" fill="#1B2335" stroke="#334155" stroke-width="8" />
  
  <!-- Viewfinder / Top hump -->
  <path d="M190 160 L220 120 L292 120 L322 160 Z" fill="#1B2335" stroke="#334155" stroke-width="8" />
  
  <!-- Outer Focus Ring -->
  <circle cx="256" cy="265" r="72" fill="#0B0F17" stroke="#334155" stroke-width="8" />

  <!-- Inner Glowing Emerald Lens / Check Indicator -->
  <circle cx="256" cy="265" r="50" fill="url(#emeraldGrad)" filter="url(#glow)" />
  
  <!-- Crisp Checkmark inside lens -->
  <path d="M232 265 L248 281 L282 245" fill="none" stroke="#000000" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Recording Red Dot Indicator -->
  <circle cx="362" cy="200" r="10" fill="#EF4444" />

  <!-- Typographic Badge -->
  <text x="256" y="425" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="6" fill="#E2E8F0" text-anchor="middle">SHOOT FLOW</text>
</svg>